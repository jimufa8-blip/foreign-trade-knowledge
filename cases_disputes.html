},

{
title:"海关与税务",
ids:[9,10,11,12]
},

{
title:"贸易管制",
ids:[13,14]
},

{
title:"结算与保险",
ids:[15,16,17]
},

{
title:"知识产权",
ids:[18,19,20,21]
},

{
title:"跨境电商",
ids:[22,23,24]
},

{
title:"产品与合规",
ids:[25,26,27]
},

{
title:"代理与经销",
ids:[28,29,30,31,32,33]
},

{
title:"投资与合作",
ids:[34,35]
},

{
title:"生产与采购",
ids:[36,37,38,39,40,41]
},

{
title:"工程与服务",
ids:[42,43,44,45]
},

{
title:"数据与营销",
ids:[46,47,48]
},

{
title:"商业合规",
ids:[49,50,51]
},

{
title:"争议与追责",
ids:[52,53,54,55,56,57,58,59,60]
}

];


/* =========================================================
   03. 获取元素
========================================================= */

const categoryBar =
    document.getElementById("categoryBar");

const dropdown =
    document.getElementById("dropdown");

const dropdownTitle =
    document.getElementById("dropdownTitle");

const dropdownCount =
    document.getElementById("dropdownCount");

const dropdownGrid =
    document.getElementById("dropdownGrid");

const caseGrid =
    document.getElementById("caseGrid");

const tooltip =
    document.getElementById("tooltip");

const toast =
    document.getElementById("toast");


/* =========================================================
   04. 创建案例卡片
========================================================= */

cases.forEach(item => {

    const card =
        document.createElement("article");

    card.className =
        "case-card";

    card.id =
        "case-" + item.id;


    const no =
        document.createElement("div");

    no.className =
        "case-no";

    no.textContent =
        String(item.id).padStart(2,"0");


    const title =
        document.createElement("div");

    title.className =
        "case-title";

    title.textContent =
        item.title;


    title.addEventListener(
        "click",
        async () => {

            const text =
                item.title + "案例";

            await copyText(text);

            showToast(
                "已复制：" + text
            );

        }
    );


    addTooltip(
        title,
        item.title + "案例"
    );


    const label =
        document.createElement("div");

    label.className =
        "case-label";

    label.textContent =
        "典型纠纷方向";


    const directions =
        document.createElement("div");

    directions.className =
        "case-directions";


    item.directions.forEach(
        direction => {

            const button =
                document.createElement("div");

            button.className =
                "direction";

            button.textContent =
                direction;


            const fullText =
                `${item.title}的${direction}案例`;


            button.addEventListener(
                "click",
                async event => {

                    event.stopPropagation();

                    await copyText(
                        fullText
                    );

                    button.classList.add(
                        "copied"
                    );

                    showToast(
                        "已复制：" + fullText
                    );


                    setTimeout(
                        () => {

                            button.classList.remove(
                                "copied"
                            );

                        },
                        700
                    );

                }
            );


            addTooltip(
                button,
                fullText
            );


            directions.appendChild(
                button
            );

        }
    );


    card.appendChild(no);

    card.appendChild(title);

    card.appendChild(label);

    card.appendChild(directions);

    caseGrid.appendChild(card);

});


/* =========================================================
   05. 创建顶部大类导航
========================================================= */

groups.forEach(
    (group,index) => {

        const button =
            document.createElement("div");

        button.className =
            "category";

        button.textContent =
            group.title;

        button.dataset.index =
            index;


        button.addEventListener(
            "click",
            event => {

                event.stopPropagation();

                openGroup(
                    group,
                    button
                );

            }
        );


        categoryBar.appendChild(
            button
        );

    }
);


/* =========================================================
   06. 打开大类
========================================================= */

function openGroup(group,button) {

    const alreadyOpen =
        dropdown.classList.contains("show") &&
        dropdown.dataset.index ===
        button.dataset.index;


    document
        .querySelectorAll(".category")
        .forEach(
            item => {

                item.classList.remove(
                    "active"
                );

            }
        );


    if (alreadyOpen) {

        closeDropdown();

        return;

    }


    button.classList.add(
        "active"
    );


    dropdown.dataset.index =
        button.dataset.index;


    dropdownTitle.textContent =
        group.title;


    dropdownCount.textContent =
        group.ids.length +
        " 个案例类型";


    dropdownGrid.innerHTML =
        "";


    group.ids.forEach(
        id => {

            const item =
                cases.find(
                    c => c.id === id
                );

            if (!item)
                return;


            const box =
                document.createElement("div");

            box.className =
                "dropdown-case";


            const title =
                document.createElement("div");

            title.className =
                "dropdown-case-title";

            title.textContent =
                `${String(item.id).padStart(2,"0")} · ${item.title}`;


            /*
             * 点击案例标题
             */

            title.addEventListener(
                "click",
                event => {

                    event.stopPropagation();

                    closeDropdown();

                    jumpToCase(
                        item.id
                    );

                }
            );


            const small =
                document.createElement("div");

            small.className =
                "dropdown-small";


            item.directions.forEach(
                direction => {

                    const span =
                        document.createElement("span");

                    span.textContent =
                        direction;


                    const fullText =
                        `${item.title}的${direction}案例`;


                    /*
                     * 点击小类
                     */

                    span.addEventListener(
                        "click",
                        async event => {

                            event.stopPropagation();


                            await copyText(
                                fullText
                            );


                            showToast(
                                "已复制：" +
                                fullText
                            );


                            closeDropdown();


                            jumpToCase(
                                item.id
                            );

                        }
                    );


                    addTooltip(
                        span,
                        fullText
                    );


                    small.appendChild(
                        span
                    );

                }
            );


            box.appendChild(
                title
            );

            box.appendChild(
                small
            );


            dropdownGrid.appendChild(
                box
            );

        }
    );


    dropdown.classList.add(
        "show"
    );

}


/* =========================================================
   07. 关闭下拉
========================================================= */

function closeDropdown() {

    dropdown.classList.remove(
        "show"
    );


    document
        .querySelectorAll(".category")
        .forEach(
            item => {

                item.classList.remove(
                    "active"
                );

            }
        );

}


/* =========================================================
   08. 页面其他地方点击
========================================================= */

document.addEventListener(
    "click",
    event => {

        if (
            !event.target.closest(".dropdown") &&
            !event.target.closest(".category")
        ) {

            closeDropdown();

        }

    }
);


/* =========================================================
   09. 跳转案例
========================================================= */

function jumpToCase(id) {

    const target =
        document.getElementById(
            "case-" + id
        );


    if (!target)
        return;


    target.scrollIntoView({
        behavior:"smooth",
        block:"start"
    });


    setTimeout(
        () => {

            target.classList.remove(
                "flash"
            );

            void target.offsetWidth;

            target.classList.add(
                "flash"
            );

        },
        450
    );

}


/* =========================================================
   10. Tooltip
========================================================= */

function addTooltip(element,text) {

    element.addEventListener(
        "mouseenter",
        event => {

            tooltip.textContent =
                text;

            tooltip.style.display =
                "block";

            moveTooltip(event);

        }
    );


    element.addEventListener(
        "mousemove",
        event => {

            moveTooltip(event);

        }
    );


    element.addEventListener(
        "mouseleave",
        () => {

            tooltip.style.display =
                "none";

        }
    );

}


/* =========================================================
   11. Tooltip跟随鼠标
========================================================= */

function moveTooltip(event) {

    const gap = 15;

    let x =
        event.clientX + gap;

    let y =
        event.clientY + gap;


    const rect =
        tooltip.getBoundingClientRect();


    if (
        x + rect.width >
        window.innerWidth - 10
    ) {

        x =
            event.clientX -
            rect.width -
            gap;

    }


    if (
        y + rect.height >
        window.innerHeight - 10
    ) {

        y =
            event.clientY -
            rect.height -
            gap;

    }


    if (x < 10)
        x = 10;

    if (y < 10)
        y = 10;


    tooltip.style.left =
        x + "px";

    tooltip.style.top =
        y + "px";

}


/* =========================================================
   12. 复制
========================================================= */

async function copyText(text) {

    try {

        if (
            navigator.clipboard &&
            window.isSecureContext
        ) {

            await navigator.clipboard.writeText(
                text
            );

        }

        else {

            const textarea =
                document.createElement(
                    "textarea"
                );

            textarea.value =
                text;

            textarea.style.position =
                "fixed";

            textarea.style.left =
                "-9999px";

            document.body.appendChild(
                textarea
            );

            textarea.focus();

            textarea.select();

            document.execCommand(
                "copy"
            );

            textarea.remove();

        }

    }

    catch(error) {

        console.error(
            "复制失败",
            error
        );

    }

}


/* =========================================================
   13. Toast
========================================================= */

let toastTimer =
    null;


function showToast(text) {

    toast.textContent =
        text;

    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            1800
        );

}


/* =========================================================
   14. ESC关闭
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape"
        ) {

            closeDropdown();

            tooltip.style.display =
                "none";

        }

    }
);
